<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>汽車怎麼運作 · 互動教材(試作版)</title>
<style>:root{ --paper:#f4efe3; --paper2:#faf6ec; --ink:#231e16; --ink2:#6b6254; --accent:#cf5038; --gold:#f4b829; --ok:#3f8f63; --nav-w:260px; --drawer-w:360px }
*{ box-sizing:border-box }
html,body{ margin:0; height:100%; background:var(--paper); color:var(--ink); overflow:hidden;
  font:14px/1.55 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif }
.en{ color:var(--ink2); font-size:.86em; font-weight:400 }
button{ font:inherit; font-size:13px; color:var(--ink); background:#fffdf6; border:1.5px solid var(--ink); border-radius:8px; padding:3px 11px; cursor:pointer; box-shadow:2px 2px 0 var(--ink) }
button:hover{ background:#fff6da }
button:active{ transform:translate(2px,2px); box-shadow:none }
button:disabled{ opacity:.45; cursor:default; box-shadow:none }
button.on{ background:var(--gold) }
input[type=range]{ accent-color:var(--accent) }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px }

/* layout */
#app{ position:fixed; inset:0; display:grid; grid-template-columns:1fr }
#main{ position:relative; min-width:0; display:flex; flex-direction:column; height:100% }
#view{ position:relative; flex:1; min-height:0 }
#gl{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab }
#gl:active{ cursor:grabbing }

/* paper */
#grain{ position:fixed; inset:0; pointer-events:none; opacity:.4; mix-blend-mode:multiply; z-index:21;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' seed='4'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .42  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>") }
#vig{ position:fixed; inset:0; pointer-events:none; z-index:22; background:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 58%, rgba(120,95,60,.16) 100%) }

/* sidebar */
.stage-h{ margin:12px 8px 4px; font-size:11px; letter-spacing:.08em; color:var(--ink2); text-transform:uppercase }
.nv{ display:flex; gap:8px; align-items:flex-start; width:100%; text-align:left; padding:7px 8px; margin:2px 0; border:1.5px solid transparent; border-radius:8px; background:none; box-shadow:none; cursor:pointer }
.nv:hover{ background:#fff6da } .nv:active{ transform:none }
.nv .no{ flex:none; width:22px; height:22px; border-radius:50%; border:1.5px solid var(--ink); display:grid; place-items:center; font-size:12px; font-weight:600; background:#fffdf6 }
.nv .tx{ flex:1; line-height:1.3 } .nv .tx small{ display:block; color:var(--ink2); font-size:11px }
.nv.cur{ border-color:var(--ink); background:#fff6da }
.nv.done .no{ background:var(--ok); color:#fff; border-color:var(--ok) }
.nv.doing .no{ background:var(--gold) }
.nv.soon{ opacity:.5; cursor:default } .nv.soon:hover{ background:none }
.nv .tag{ font-size:10px; color:var(--ink2); border:1px solid var(--ink2); border-radius:99px; padding:0 6px; white-space:nowrap }
.nav-foot{ display:flex; gap:6px; padding:10px 12px; border-top:1px solid rgba(35,30,22,.25) }
.nav-foot button{ font-size:12px; padding:2px 8px; box-shadow:1px 1px 0 var(--ink) }

/* top bar */
#top{ position:relative; z-index:6; display:flex; align-items:center; gap:10px; padding:8px 14px; border-bottom:1.5px solid var(--ink); background:rgba(250,246,236,.9) }
#ttl{ flex:1; min-width:0; font-weight:600; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
#badge{ font-size:12px; color:var(--ink2); border:1px solid var(--ink2); padding:1px 9px; border-radius:99px; white-space:nowrap }

/* readout + labels */
#readout{ position:absolute; left:16px; top:12px; max-width:min(440px,60%); pointer-events:none; z-index:3 }
#readout .t{ font-size:17px; font-weight:700 } #readout .s{ font-size:12px; color:var(--ink2) }
#readout .d{ font-size:13px; margin-top:4px } #readout .m{ font-size:13px; margin-top:6px; padding:5px 9px; background:rgba(255,246,218,.92); border:1.5px solid var(--ink); border-radius:8px; display:inline-block }
#diagram{ position:absolute; right:12px; bottom:10px; z-index:4; width:330px; height:170px; background:rgba(250,246,236,.95); border:1.5px solid var(--ink); border-radius:10px; box-shadow:2px 2px 0 var(--ink); padding:2px }
#diagram[hidden]{ display:none } #diagram canvas{ width:100%; height:100%; display:block }
#tip3d{ position:absolute; z-index:5; pointer-events:none; background:rgba(250,246,236,.96); border:1.5px solid var(--ink); border-radius:8px; padding:3px 9px; font-size:13px; font-weight:600; box-shadow:2px 2px 0 var(--ink); white-space:nowrap }
#tip3d[hidden]{ display:none } #tip3d small{ display:block; font-weight:400; color:var(--ink2); font-size:11px }
#labels{ position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:2 }
.lbl{ position:absolute; left:0; top:0; font-size:12px; white-space:nowrap; will-change:transform }
.lbl i{ position:absolute; left:-3px; top:-3px; width:6px; height:6px; border-radius:50%; background:var(--ink) }
.lbl span{ position:absolute; padding:1px 7px; background:rgba(250,246,236,.92); border:1px solid var(--ink); border-radius:6px }
.lbl em{ font-style:normal; color:var(--ink2); font-size:11px }

/* step bar */
#steps:empty{ display:none }
#steps{ position:relative; z-index:6; border-top:1.5px solid var(--ink); background:rgba(250,246,236,.95); padding:8px 14px 10px; display:grid; gap:7px }
.srow{ display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center }
.stp{ display:flex; align-items:center; gap:6px; padding:3px 10px 3px 4px }
.stp .n{ width:20px; height:20px; border-radius:50%; background:var(--ink); color:#fff; font-size:11px; display:grid; place-items:center }
.stp.done .n{ background:var(--ok) } .stp.cur{ background:var(--gold) } .stp.run{ background:#ffe39a }
.hint{ font-size:12px; color:var(--ink2) } .hint b{ color:var(--accent) }
.slr{ display:flex; align-items:center; gap:8px; flex:1; min-width:240px }
.slr input{ flex:1; min-width:120px }
.chips{ display:flex; font-size:12px; text-align:center; min-width:220px }
.chips div{ flex:1; padding:1px 8px; border:1px solid var(--ink2); margin-left:-1px; color:var(--ink2); white-space:nowrap }
.chips div.act{ background:var(--gold); color:var(--ink); border-color:var(--ink); font-weight:600 }
.tg{ font-size:12px; padding:2px 9px }
.sel{ display:inline-flex; gap:5px; align-items:center } .sel .tg{ min-width:34px }

/* drawer + settings */
#drawer{ position:absolute; top:46px; right:0; bottom:0; width:min(var(--drawer-w),92%); z-index:8; background:var(--paper2); border-left:1.5px solid var(--ink); display:flex; flex-direction:column; box-shadow:-3px 0 0 rgba(35,30,22,.2) }
#drawer[hidden], #settings[hidden], #banner[hidden]{ display:none }
.tabs{ display:flex; border-bottom:1px solid var(--ink2) } .tabs button{ flex:1; border:0; border-radius:0; box-shadow:none; padding:8px 4px; background:none; border-bottom:3px solid transparent }
.tabs button.on{ border-bottom-color:var(--accent); background:#fff6da; font-weight:600 }
.tabbody{ flex:1; overflow:auto; padding:12px 16px 20px } .tabbody h4{ margin:14px 0 4px; font-size:13px } .tabbody h4:first-child{ margin-top:0 }
.tabbody ul{ margin:4px 0 8px; padding-left:20px } .tabbody li{ margin:3px 0 }
.ck{ list-style:none; padding:0!important } .ck li{ display:flex; gap:8px; align-items:flex-start }
.vr{ width:100%; border-collapse:collapse; font-size:12px } .vr td,.vr th{ border-top:1px solid rgba(35,30,22,.2); padding:5px 4px; vertical-align:top; text-align:left }
.st{ display:inline-block; font-size:11px; padding:0 7px; border-radius:99px; border:1px solid var(--ink2); white-space:nowrap }
.st.ok{ background:#d8efe1; border-color:var(--ok) } .st.part{ background:#e9f0c8 } .st.pending{ background:#fff0c4 } .st.diff{ background:#ffd9cf; border-color:var(--accent) }
.note{ font-size:12px; color:var(--ink2); background:#fff6da; border:1px dashed var(--ink2); border-radius:8px; padding:6px 9px; margin:8px 0 }
#settings{ position:absolute; top:46px; right:8px; z-index:9; width:min(330px,94%); background:var(--paper2); border:1.5px solid var(--ink); border-radius:12px; padding:10px 14px 12px; box-shadow:3px 3px 0 var(--ink); display:grid; gap:7px }
#settings label{ display:flex; align-items:center; gap:8px; font-size:13px } #settings label span{ width:84px; flex:none } #settings input[type=range]{ flex:1 }
#settings h4{ margin:0; font-size:13px }
#banner{ position:absolute; left:50%; top:16px; transform:translateX(-50%); z-index:7; background:#e5f4ea; border:1.5px solid var(--ok); border-radius:12px; padding:9px 14px; box-shadow:3px 3px 0 var(--ok); max-width:92%; display:flex; gap:12px; align-items:center }

/* home */
#home{ position:absolute; inset:0; z-index:4; overflow:auto; padding:22px clamp(14px,5vw,56px) 28px; background:linear-gradient(var(--paper),rgba(244,239,227,.6)) }
#home[hidden]{ display:none }
#home h2{ margin:0 0 4px; font-size:26px } #home p{ max-width:720px; margin:6px 0 }
.cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; margin:16px 0 }
.card{ text-align:left; padding:10px 12px; border-radius:12px; display:block; width:100%; background:#fffdf6 }
.card.soon{ opacity:.5; cursor:default }
.card .no{ font-size:11px; color:var(--ink2) } .card b{ font-size:15px } .card small{ display:block; color:var(--ink2); margin-top:3px }
.card.done{ border-color:var(--ok); box-shadow:2px 2px 0 var(--ok) }
.cta{ font-size:15px; padding:7px 18px; background:var(--gold) }

@media (max-width:900px){
  #badge{ display:none } #readout{ max-width:78% } #top{ flex-wrap:wrap }
}

/* route popover (replaces the sidebar) */
#route{ position:absolute; top:46px; left:8px; z-index:9; width:min(310px,94%); max-height:calc(100% - 56px); overflow:auto; background:var(--paper2); border:1.5px solid var(--ink); border-radius:12px; padding:10px 8px 8px; box-shadow:3px 3px 0 var(--ink) }
#route[hidden]{ display:none } #route h4{ margin:2px 8px 0; font-size:14px } #route .rp{ margin:2px 8px 6px; font-size:12px; color:var(--ink2) }
#route .nav-foot{ padding:8px 8px 0; margin-top:6px }
/* numbered markers on the car: number = suggested order, ring = progress */
#marks{ position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:3 } #marks[hidden]{ display:none }
.mk{ position:absolute; left:0; top:0; width:36px; height:36px; margin:-18px 0 0 -18px; padding:3px; border:0; border-radius:50%; cursor:pointer; pointer-events:auto; will-change:transform;
  background:conic-gradient(var(--c,#b9b2a4) calc(var(--p,0)*360deg), rgba(35,30,22,.2) 0); box-shadow:2px 2px 0 var(--ink) }
.mk b{ display:grid; place-items:center; width:100%; height:100%; border-radius:50%; background:#fffdf6; border:1.5px solid var(--ink); font-size:13px; color:var(--ink) }
.mk.doing{ --c:#f4b829 } .mk.done{ --c:#3f8f63 } .mk.done b{ background:#3f8f63; color:#fff; border-color:#2d6b49 }
.mk.soon{ opacity:.55; cursor:default; box-shadow:none; background:rgba(35,30,22,.18) } .mk.extra b{ border-style:dashed; font-size:12px }
.mk .tt{ position:absolute; left:42px; top:6px; white-space:nowrap; font-size:12px; background:rgba(250,246,236,.96); border:1px solid var(--ink); border-radius:6px; padding:0 7px; opacity:0; pointer-events:none; transition:opacity .12s }
.mk:hover .tt, .mk:focus-visible .tt{ opacity:1 }

/* shell display control (car view only) */
#shell{ position:absolute; right:14px; top:12px; z-index:4; display:flex; flex-direction:column; align-items:flex-end; gap:6px } #shell[hidden]{ display:none }
#shell .seg{ display:inline-flex; background:rgba(250,246,236,.92); border:1.5px solid var(--ink); border-radius:10px; box-shadow:2px 2px 0 var(--ink); overflow:hidden }
#shell .seg button{ border:0; box-shadow:none; border-radius:0; background:transparent; padding:5px 11px; font:inherit; font-size:13px; color:var(--ink); cursor:pointer; border-right:1px solid rgba(35,30,22,.25) }
#shell .seg button:last-child{ border-right:0 } #shell .seg button.on{ background:#f4b829; font-weight:700 }
#shell .sw{ display:flex; gap:6px; padding:4px 7px; background:rgba(250,246,236,.92); border:1.5px solid var(--ink); border-radius:10px }
#shell .sw button{ box-shadow:none; width:20px; height:20px; border-radius:50%; border:1.5px solid var(--ink); padding:0; cursor:pointer } #shell .sw button.on{ box-shadow:0 0 0 2px #fffdf6, 0 0 0 3.5px var(--ink) }
@media (max-width:760px){ #shell{ top:auto; bottom:10px } }

#shell .seg.wrap{ flex-wrap:wrap; max-width:330px; justify-content:flex-end } #shell .seg.wrap button{ border-bottom:1px solid rgba(35,30,22,.25) }
</style>
</head>
<body>
<div id="app">
  <main id="main">
    <header id="top">
      <button id="bBackView" hidden>◀ 返回</button>
      <div id="ttl"></div>
      <span id="badge">試作版,內容未經專業審核</span>
      <button id="bRoute" aria-expanded="false">建議路線</button>
      <button id="bInfo" aria-expanded="false">學習面板</button>
      <button id="bSet" aria-expanded="false">設定</button>
    </header>
    <section id="view">
      <canvas id="gl"></canvas>
      <div id="labels"></div>
      <div id="marks"></div>
      <div id="shell" hidden></div>
      <div id="readout"></div>
      <div id="banner" hidden></div>
      <div id="diagram" hidden><canvas></canvas></div>
    </section>
    <footer id="steps"></footer>
    <aside id="drawer" hidden></aside>
    <div id="settings" hidden></div>
    <div id="route" hidden></div>
    <input id="fImport" type="file" accept=".json,application/json" hidden>
  </main>
  <div id="grain"></div><div id="vig"></div>
</div>

<script>/* ---- js/00-core.js ---- */
/* Core: namespace, safe storage, tiny event bus, DOM helpers, figure registry. */
window.CF = window.CF || {};
(function (CF) {
  'use strict';
  CF.version = '0.1.0-m1';
  CF.D2R = Math.PI / 180;
  CF.TEST = /[?&]test=1/.test(location.search);

  /* localStorage can throw (private windows, blocked data): fall back to memory */
  const mem = {};
  CF.store = {
    get(k, def) {
      try { const v = localStorage.getItem(k); if (v !== null) return JSON.parse(v); } catch (e) {}
      return k in mem ? mem[k] : def;
    },
    set(k, v) { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    remove(k) { delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} },
  };

  const L = {};
  CF.on = (ev, fn) => { (L[ev] = L[ev] || []).push(fn); };
  CF.emit = (ev, arg) => { (L[ev] || []).forEach(fn => fn(arg)); };

  CF.$ = (sel, root) => (root || document).querySelector(sel);
  CF.$$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  CF.esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  /* bilingual text object {zh,en} -> html */
  CF.bi = t => !t ? '' : (typeof t === 'string' ? CF.esc(t) : CF.esc(t.zh) + (t.en ? ` <span class="en">${CF.esc(t.en)}</span>` : ''));
  CF.zh = t => !t ? '' : (typeof t === 'string' ? t : t.zh);

  /* figure registry. A figure is a data object, see figures/fourstroke.js for the contract. */
  CF.figures = {};
  CF.defineFigure = def => {
    if (!def.id) throw new Error('figure needs an id');
    CF.figures[def.id] = def;
  };
})(window.CF);

/* ---- js/05-layout.js ---- */
/* Layout spec: where everything sits in the generic car.  SINGLE SOURCE of truth for M2c (body) and M3+ (systems).
   Units: metres.  Frame: x = forward, y = up, z = right of the car (driver sits on the LEFT, z < 0: left-hand drive).
   Origin: on the ground, midway between the axles, on the centre line.
   conf: 'src' = checked against a public source (see docs/layout-spec.md)   'conv' = common convention, not checked per car
         'assume' = my assumption, please review.
   Boxes are AABBs {c: centre, s: size [dx,dy,dz]} used for the overlap checker and as click regions; real parts are modelled inside them. */
(function (CF) {
  'use strict';
  const L = CF.LAYOUT = {};

  L.car = {
    length: 4.60, width: 1.80, height: 1.45, wheelbase: 2.70, track: 1.55, clearance: 0.15,
    frontAxleX: 1.35, rearAxleX: -1.35, floorY: 0.30, firewallX: 0.85,
    tire: { size: '235/45R19', diameter: 0.694, width: 0.235 },
    conf: { length: 'src', width: 'src', height: 'src', wheelbase: 'src', track: 'assume', tire: 'src', floorY: 'assume', firewallX: 'assume' },
    /* side profile (x,y) of the ghost body, extruded across the width */
    profile: [[-2.30, 0.45], [-2.30, 0.93], [-1.50, 0.98], [-1.00, 1.42], [-0.90, 1.45], [0.35, 1.45], [1.00, 1.00], [2.30, 0.84], [2.30, 0.45], [1.95, 0.25], [-1.95, 0.30]],
    /* styling: generic three-box sedan in the manner of a classic German saloon: long bonnet, cab-rearward, slanted nose, kinked rear quarter.
       No badges and no kidney grille (those are trademarks). */
    body: { color: 0x2a5fae, tint: 0.34, glassColor: 0x7fb0e6 },
  };

  /* ---- body shape: pure functions of x (metres, front = +x), shared by the 3D body (25-body) and the layout checker.
     The body is lofted from cross-sections; every section is a closed loop in the (z, y) plane, built from a half profile p0..p12:
       p0-p2 floor and bottom corner, p3-p7 lower side (sill -> belt line), p8 shelf, p9-p10 window rows / top edge, p11-p12 roof or bonnet crown.
     g(x) blends between "bonnet / boot deck" (0) and "greenhouse" (1).  Sporty German saloon in proportion (long bonnet, cab-rearward, sloping roof);

  S.xmin = -2.30; S.xmax = 2.30;
  S.archR = 0.425; S.archY = 0.347;                              // wheel arch radius and centre height (follows the tyre)
  const yMidF = hermite([[-2.30, 0.86], [-2.24, 0.92], [-2.10, 0.975], [-1.85, 1.0], [-1.45, 1.0], [-1.15, 1.2], [-0.85, 1.37], [-0.50, 1.43], [-0.10, 1.45], [0.20, 1.43], [0.45, 1.28], [0.70, 1.08], [0.82, 0.995], [1.15, 0.965], [1.40, 0.93], [1.90, 0.885], [2.15, 0.85], [2.24, 0.815], [2.30, 0.745]]);
  const yBotF = hermite([[-2.30, 0.46], [-2.22, 0.36], [-2.05, 0.30], [-1.80, 0.29], [-0.9, 0.28], [0.9, 0.28], [1.9, 0.28], [2.10, 0.29], [2.24, 0.31], [2.30, 0.37]]);
  const beltF = hermite([[-2.30, 0.88], [-1.7, 0.95], [-0.5, 0.89], [0.8, 0.85], [1.4, 0.84], [2.1, 0.80], [2.30, 0.70]]);
  S.g = x => sm((x + 1.50) / 0.15) * (1 - sm((x - 0.75) / 0.10));
  S.yMid = yMidF;
  S.yFloor = yBotF;
  S.yBot = x => { let y = yBotF(x); [car.frontAxleX, car.rearAxleX].forEach(ax => { const d = Math.abs(x - ax); if (d < S.archR) y = Math.max(y, S.archY + Math.sqrt(S.archR * S.archR - d * d)); }); return y; };

  S.cabinW = x => 0.745 * (1 - 0.05 * Math.pow(cl((-1.0 - x) / 0.6), 2));
  const tw = y => 1 - 0.07 * Math.pow(cl((y - 0.62) / 0.35), 2);   // tumblehome of the lower side

      tube('bypass', [[TH.c[0], TH.c[1], TH.c[2]], [1.55, 0.72, 0.29], [1.47, 0.66, 0.31]], 0.011);
      tube('top', TOP, 0.02);
      tube('bottom', BOT, 0.02);

      /* radiator: see-through box, vertical tubes, cap */
      const rad = ink(new TH3.BoxGeometry(R.s[0], R.s[1], R.s[2]), PAL.metal, { ghost: true, tint: 0.22, nf: 4 }); rad.position.set(R.c[0], R.c[1], R.c[2]); root.add(rad);

        readout(P) {

        },
      };
    },

      cat.add(ink(new T.CylinderGeometry(0.03, 0.06, 0.09, 24).rotateZ(-Math.PI / 2).translate(-CAT.s[0] * 0.31 - 0.045, 0, 0), PAL.dark, { ghost: true, tint: 0.2, nf: 14, edges: false }));
      const core = parts.cyl(0.052, CAT.s[0] * 0.46, PAL.brass, { axis: 'x', seg: 28, nf: 20, edges: false }); cat.add(core);

      ctx.label(new TH.Vector3(G.xs + 0.105 * Math.sin(G.tilt), G.seat + 0.105, -G.zs), { zh: '挺桿', en: 'Tappet' }, { dx: 22, dy: -12 });
      ctx.label(new TH.Vector3(-G.xs, G.seat + 0.01, -G.zs), { zh: '氣門', en: 'Valve' }, { dx: -80, dy: 10 });

/* Boot + hash router:  #/  (car overview)   #/region/<id>   #/fig/<id>  (a teaching topic) */
(function (CF) {
  'use strict';
  function parse() {
    let m = location.hash.match(/^#\/fig\/([\w-]+)/);
    if (m && CF.figures[m[1]]) return 'topic:' + m[1];
    m = location.hash.match(/^#\/region\/([\w-]+)/);
    if (m && CF.LAYOUT.regions.some(r => r.id === m[1])) return 'region:' + m[1];
    return 'car';
  }
  function boot() {
    CF.engine.init(); CF.ui.init();
    addEventListener('hashchange', () => CF.ui.go(parse()));
    CF.ui.go(parse(), { instant: true, force: true });
    if (CF.TEST) window.__cf = CF;
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})(window.CF);
